name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install product package
        run: python -m pip install .

      - name: Validate installed product metadata and command
        run: |
          terminal-games --version
          python -c "import importlib.metadata as m, terminal_games; assert m.version('terminal-games') == terminal_games.__version__"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

name: release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_guard.py"
      - "tests/test_release_guard.py"
      - "pyproject.toml"
      - "terminal_games/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install product package
        run: python -m pip install .

      - name: Validate installed product metadata and command
        run: |
          terminal-games --version
          python -c "import importlib.metadata as m, terminal_games; assert m.version('terminal-games') == terminal_games.__version__"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag
        if: github.event_name == 'push'
        run: python scripts/release_guard.py --tag "$GITHUB_REF_NAME"

      - name: Report non-publishing build version
        if: github.event_name != 'push'
        run: python scripts/release_guard.py

      - name: Install build frontend
        run: python -m pip install "build==1.2.2.post1"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Install built wheel and validate command
        run: |
          python -m pip install --force-reinstall dist/*.whl
          terminal-games --version
          python -c "import importlib.metadata as m, terminal_games; assert m.version('terminal-games') == terminal_games.__version__"

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Terminal_Games $GITHUB_REF_NAME" \
            --generate-notes
